name: Copy bet slips from Cloudinary
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mirror-slips
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/mirror_slips.py
      - name: Save new slips
        run: |
          git config user.name "slip-robot"
          git config user.email "slip-robot@users.noreply.github.com"
          git add slips
          if git diff --cached --quiet; then echo "No new slips"; exit 0; fi
          git commit -m "Add new bet slips"
          git pull --rebase origin main
          git push origin HEAD:main
